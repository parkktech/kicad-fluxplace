max_current_ma = 4200        # electrical review: worst-case load sum 4.17 A = CM5 3.0 A (spec allowance; CM5 datasheet says design for 2.5 A, p36) + U102 input 0.56 A
                             # + ISOW1044 x2 0.42 A (211 mA each, ISOW1044.pdf#p13) + U413 limit 0.16 A + K1 coil 21 mA + misc [high]
pour = true
holdup_ms = 0.5
nominal_v = 5.0
min_v = 4.75
max_v = 5.25                 # CM5 input range 4.75-5.25 V (CM5-datasheet.pdf#p20)
load_a = 2.5
source = "U100"
