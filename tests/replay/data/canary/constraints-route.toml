# Battery-lead fuse is off-board (spec 3.1, 5 A). Input current is summed from the rails' max_current_ma, nominal_v and input_eff above.
[fuse]
rating_a = 5.0
v_min = 9.0                  # spec 3.1 acceptance; the spec states no lower figure
also_v = [6.0]               # sensitivity only: cranking / low-battery cut-off is not specified
continuous_pct = 0.75        # fuses run at <= 75 % of rating in continuous service (Littelfuse blade-fuse guidance; secondary source, unverified)
rerate = 1.0                 # temperature rerating at [env] temp_max_c is UNKNOWN: the fuse part is not specified
extra_w = 0.3                # K-line pull-up 1 k at 14.5 V 0.21 W + TLIN1029 5 mA + dividers

[elec]
cap_margin = 1.25

# Input TVS D1: re-selected 2026-09-07 (D70ao) for the 14.5 V max bus above —
# SMDJ18A, 18 V standoff, Vc 29.2 V @ Ipp (Littelfuse datasheet) — vs SMDJ24A's
# 38.9 V/3% margin. downstream_max_v stays Q1's 40 V P-FET rating.
[protection]
tvs_ref = "D1"
downstream_max_v = 40
clamp_v = 29.2
min_margin_pct = 15

