[power."+3V3"]
support = { C28 = "U300.15", C29 = "U300.23", C52 = "U3.8", C56 = "U5.7", C61 = "U7.5", C62 = "U9.5", C411 = "U401.14", R37 = "U600.24", R125 = "U600.24", R48 = "U300.15", R49 = "U300.15" }   # D71eg: C28/C29 one 100 nF per USB2514B VDD33 pin (USB2514BI-AEZG.pdf#p14); C52 MAX-M10M VCC; C56 TLV320AIC3104 IOVDD (TLV320AIC3104IRHBR.pdf#p92, constraints [bom] note); C61/C62 TLV7031 U7/U9 (TLV7031DBVR.pdf#p8); C411 MCP2518FD VDD (MCP2518FD.pdf#p5); R37/R125 pull-ups sit at the I2C/PG expander U600; R48/R49 LED series resistors, no IC pin
nominal_v = 3.3
