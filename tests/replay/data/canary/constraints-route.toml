# not "tens of ms" — that would need ~80,000 uF at 1 A.
# load_a = 2.5 (2026-09-07, D70ap): CM5 video-encode load (~2 A) + peripherals
# is the largest +5V draw on this board (no separate audio amp of note — U6 is
