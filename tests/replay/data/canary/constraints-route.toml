#   source = "<Johanson page>" (or put the areas into the footprint), then delete the two board rule areas.
# - Buck: unbroken L2 ground under the hot loop (TI SLYT682): part of the buck module template, step 5 (P5).
# - PCIe not routed under components (Quectel RM520N-GL hardware design): a routing rule, not a placement row.
# - 25 MHz x 63 = 1575.0 MHz (report): no 25 MHz source on the carrier (the Ethernet PHY clock is on the CM5); no row.

