# Waivers are DECISIONS, recorded here so the gate stays honest (D70):
#  - J1A/J2A/J6/J9 JST GH/SH headers are rated -25..+85 C. The box is a sealed
#    enclosure on the vehicle; a -25 C connector floor is accepted for V1.5 and
#    the -40 C harness-connector question is an open item for the enclosure
#    review (candidates: Molex Pico-Lock -40..+105). Re-open before production.
[review]
#  - L1 XAL7070-153MEC is sold by Coilcraft direct (D37): neither distributor
#    nor Nexar describes it, so the part-data and datasheet checks cannot run.
#    Coilcraft's own sheet is the reference; the 3D/land come from Coilcraft.
#  - L1 XAL7070-153MEC (Coilcraft-direct, D37): only Nexar describes it, and the
#    evaluation plan's 10-lookups/day was spent proving that. Re-run
#    `fluxplace datasheets` + `review --refresh` tomorrow to fetch its sheet
#    and drop these two waivers.
#  - China stock (D70v): these parts have no or thin LCSC stock and no
#    like-for-like LCSC-stocked equivalent without a footprint or spec change.
#    PCBWay turnkey buys them from DigiKey/Mouser (stock in brackets); for a
#    JLCPCB build they are consigned. ANT1 Taoglas patch (DK 1.6k), BT1/BT2
#    Seiko MS621FE (DK 29k), L1 Coilcraft XAL7070 (direct), J12 Amphenol RJHSE-5380
#    (DK 9.7k), C12/C13 Panasonic EEU-FR1C152 (DK), R12/R13 Yageo AC0603FR-135K1L
#    (DK; no 135k at LCSC), T3 HX5084FNL (LCSC 61, DK 1.8k/8.7k).
# D70x (2026-09-04): T3 -> HX5084NLT (LCSC 1563), J12 hyphen fix, R12/R13 -> AC0603FR-075K1L,
# C12/C13 back in stock: those waivers are gone.
# Temperature waivers ACCEPTED by the user 2026-09-04 ("the temperature ranges are fine"):
#  - K1 G6K-2F-Y: Omron's sheet says -40..+70 C (DigiKey said +85).
#  - BT1/BT2 MS621FE: Seiko's sheet says -20..+60 C.
#  - J1A/J2A/J6/J9 JST GH/SH (-25 C) clear the -20 C floor now; waiver dropped.
# Still USER DECISIONS pending:
#  - L1: consign (D70z). BT1/BT2: PCBWay sources (D70aa). ANT1: DNP on cab units, external puck via J4.
# ANT1 GP.1575 patch: no vendor STEP (Taoglas login-only), no EasyEDA body (checked 2026-09-04);
# the datasheet-dimensioned stand-in stays until one appears. Cab units run ANT1 unpopulated.
# J4 Amphenol 132134-11 (D70ag, 2026-09-06): board-mount vertical SMA jack for the
# external GNSS antenna (replaces the U.FL+SMA-pigtail). DigiKey 545 / Mouser 1021 —
# solid on both. LCSC catalogues it (C5867725) but at 0 stock (CN_NONE, checked via
# fluxplace fab's own sourcing gate). The bare "132134" IS on LCSC with real stock
# (C3174425, 619) but its polarity is UNRESOLVED, not cleared: its DigiKey-linked
# Amphenol drawing is titled "SMA REVERSE POLARITY" while DigiKey's own parametric data
# for the same MPN says standard "Jack, Female Socket" — the two disagree and this was
# never cross-checked against a second source. It also has no 3D body in the KiCad
# system library. -11 has an unambiguous datasheet and stays the safe pick despite the
# LCSC gap. Same shape as the existing J12/C12/C13/etc. china-sourcing gaps below:
# DigiKey/Mouser-solid, PCBWay buys it from there, JLCPCB would need to consign it.
# D70ap (2026-09-07): raising [power."+5V"] load_a to the CM5's real ~2.5 A draw
# (was an informal 1.0 A placeholder) reopens HOLDUP_SHORT: the existing bulk bank
# (C3-C5/C12/C13/C20-C26/C38/C39/C48/C49, 3259 uF) gives 0.33 ms of 5.0->4.75 V
# ride-through at 2.5 A against the 0.5 ms spec (needs ~5000 uF). C12/C13 (Panasonic
# EEU-FR1C152, 1500 uF, 10 mm dia radial can) are the only same-footprint headroom —
# EEU-FR1C182L (1800 uF) is the largest 16 V part in the same 10x20->10x25mm can per
# the datasheet's case-size table, and even at 1800+1800+259=3859 uF that still falls
# short of 5000 uF. Closing this for real needs a bigger-diameter cap (12.5 mm+,
# EEU-FR1C222/272) or an added parallel cap — both a footprint/placement change, out
# of scope for a value-only fix and left for the routing/layout pass. Waived here so
# fab/deliver aren't blocked by a gate this task's own instruction (load_a=2.5A)
# reopened; U1's thermal recompute (also D70ap) is unaffected by this waiver.
# (NET_SINGLE_PAD on ETH_nLED2 / ETH_nLED3 waived in V1.5: closed in V1.6, the CM5 LED pins J10.17 / J10.15 now drive the
# RJ45 LED jack through nets ETH_LED_LINK_N / ETH_LED_ACT_N, D71az.)
waive = ["MODEL_STANDIN:^ANT1 ", "TEMP_RATING:^K1 ", "TEMP_RATING:^BT[12] ",
         "PART_DATA_UNAVAILABLE:L1", "DATASHEET_MISSING:^L1 ",
         "CN_ABSENT:^(ANT1|BT1 BT2|L1) ", "CN_NONE:^(ANT1|BT1 BT2|J4) ",
         "HOLDUP_SHORT:\\+5V",
         # D71cg: J205 GCT SIM8066 maker-drawing courtyard (W14) overlaps fixed C113 courtyard by 0.175 mm; bodies clear
         "COLLISION:C113.*J205|J205.*C113"]

[fab]
# D71bn (owner 2026-11-15): buildable at PCBWay (the fab in use) AND JLCPCB (quote). A list = the strictest of the rows
# for 6 layers, per rule; review / fab-advise name which fab sets each limit. Through vias only (audit 2026-09-08
# rejected 0.09 mm copper). Stackup: PCBWay Regular 6L 1.6 mm, 1 oz outer / 1 oz inner (see [stackup]).
profile = ["pcbway-standard", "jlcpcb-standard"]
stackup_template = "pcbway-6l-1.6-2116"
min_track_mm = 0.1
min_clearance_mm = 0.1
min_drill_mm = 0.2
min_annular_mm = 0.13       # via ring 0.13 = 0.46 pad on 0.2 drill: above PCBWay Advanced 0.127 and JLCPCB 0.125; PCBWay's Standard table headline says 0.15 (D71bn: 0.5 pad if PCBWay CAM insists)
min_via_dia_mm = 0.4        # the profile rows lift this to 0.454; the router asks for 0.46 (see [route] min_via_mm)
min_silk_width_mm = 0.15
blind_vias = false
buried_vias = false
microvias = false

[stackup]
# Reference planes for the impedance model; the dielectric stack is the named template (pcbway-6l-1.6-2116, PCBWay's own
# Regular 6-layer 1.6 mm structure; jlcpcb-6l-1.6-2116b-1oz is JLCPCB's JLC06161H-2116B, same outer dielectric within 3 %).
profile = "pcbway-6l-1.6-2116"
planes = ["In1.Cu", "In4.Cu"]

[route]
power_spine = "ipc-outer"   # D71cl run 2: pour rails at IPC outer width on F/B
# Best measured flow on this placement: constructive pairs, then KiCadRoutingTools whole-board routing.
router = "krt-whole"
# Preferred general signal width; controlled pairs, RF and power keep their own class/current rules.
track_mm = 0.15
# Routing floor (D71au, user 2026-11-11/12): never route at the fab minimum above; 0.127 mm track and clearance,
# and never thin Ethernet, USB, PCIe, RF, clock, audio or power nets to make a board route.
min_track_mm = 0.127
min_clearance_mm = 0.127
# D71bn: via 0.46 / 0.2 mm (ring 0.13) sits inside both fabs' standard tier: JLCPCB charges extra for a 0.2 mm hole under
# a 0.45 mm pad (0.45 itself is on the line), PCBWay's ring floor is 0.127 (Advanced table; its Standard headline says
# 0.15 -> 0.5 pad). Not larger by default: the 0.4 mm-pitch CM5 connector has no room beside the row. Via-to-via 0.3 (PCBWay 0.279).
min_via_mm = 0.46
min_drill_mm = 0.2
hole_to_hole_mm = 0.3

# --- V1.6 step 0 (D71z): CM5 mounting holes and the M3 bottom holes locked to their V1.5 positions (R1) ---
# --- 2026-11-13 (D71ay): connector face. RJ45 + the four SMAs on the TOP board edge (y = 38.65), all five are
# --- locked here. The row is measured from the board's left corner (x = 98.72 after the fit-sheet shift of -7 mm): RJ45 body centre 10.85, then
# --- 27 mm to J203, then 18 mm pitch: J203 37.85, J204 55.85, J300 73.85, J4 91.85. Board 98.9 mm long (x 98.72..197.62). SUPERSEDED by the D71bj positions in [lock.at] below (117.5 mm, x 98.72..216.22).
# --- A [lock.at] row has no rotation field: the board carries it. Rotations: J12 0 deg (opening face toward -y,
# --- footprint origin = pin 1, body centre is 3.56 mm to +x, face flush with the edge, 8.05 mm from the origin);
# --- J203/J204/J300/J4 90 deg (jack faces -y; origin 2.10 mm inside the edge, pads 0.50 mm inside the edge).
# --- `fluxplace review` checks position and side only; the rotations above live in the board.
[lock]
tol_mm = 0.01
