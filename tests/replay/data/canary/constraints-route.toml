load_extra_ma = 3749         # CM5 3000 + U102 reflected 560 + U413 158 + K1 21 + misc 10 (ISOW VDD comes from the part facts)
input_eff = 0.93             # LM61460AASQRJRRQ1.pdf#p10: 93 % at 5 V out, 4 A, 13.5 V in [medium: lower at 9 V is better, hot is worse]

[power."VMODEM"]
max_current_ma = 3000        # Quectel RM520N-GL: supply must deliver >= 3.0 A continuous (Quectel_RM520N-GL_Hardware_Design_V1.0.pdf#p28); averaged use
                             # <= 1.5 A (Table 37, #p67); V1.6 modem class is a reference (card chosen later, D71j) [medium]
