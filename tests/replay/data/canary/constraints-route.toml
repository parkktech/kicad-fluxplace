drop_mv_max = 150.0
drop_mv_target = 36.0
source = "TLIN1029-Q1.pdf#p6 (pin 2 = EN, digital input), #p7 (REN internal pull-down min 125 kOhm): +3V3 max_v 3.4 V / 125 kOhm = 27.2 uA"

[[dcdrop]]
net = "+5V"
from = "U100"
to = ["D5"]   # 1N4148WS relay-coil flyback diode, cathode pad 1 on +5V, anode pad 2 = COIL_N (K1.8, Q2 drain): reverse-biased in steady state
