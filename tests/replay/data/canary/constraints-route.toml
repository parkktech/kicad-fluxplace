[[separation]]
name = "cm5-antenna-metal"
a = ["keepout:CM5_ANTENNA_CUTOUT"]
b = ["J12", "T3", "K1", "J3", "J200", "H200", "H201", "U305", "U306", "U307", "U308", "MH*", "J4", "J203", "J204", "J300"]
min_mm = 10.0
klass = "REC"
source = "CM5 datasheet 4.1.2: at least 10 mm clearance around the on-board antenna (report; page to cite). Applies while the on-board antenna is used"

# No signal under the GNSS module on the component layer (In1 is a ground plane on this stackup, so only F.Cu binds).
[placement.keepout.gnss_under]
