[[dcdrop]]
net = "+3V3"
from = "L102"
to = ["D9"]   # BAT54 (anode pad 1 on +3V3) -> VBAT_CHG -> R31 1k -> VBAT (BT1 backup cell): charge current at an empty cell
current_a = 0.0034
drop_mv_max = 150.0
drop_mv_target = 36.0
source = "bound: +3V3 max_v 3.4 V / R31 1 kOhm = 3.4 mA, diode drop neglected (conservative); BAT54LT1G.pdf#p2 (VF 0.24 V at 0.1 mA, IR 2 uA at 25 V); nets VBAT_CHG/VBAT from the board (D9.3 - R31.1, R31.2 - BT1.1)"

[[dcdrop]]
net = "+3V3"
from = "L102"
to = ["D10"]   # BAT60A (anode pad 2 on +3V3, cathode pad 1 = BCKP_CHG) -> R32 1k -> V_BCKP: backup charge current
current_a = 0.0034
drop_mv_max = 150.0
drop_mv_target = 36.0
source = "bound: +3V3 max_v 3.4 V / R32 1 kOhm = 3.4 mA, diode drop neglected (conservative); BAT60AE6327.pdf#p2 (IR), #p5 (cathode marking on pad 1); nets BCKP_CHG/V_BCKP from the board (D10.1 - R32.1)"

[[dcdrop]]
