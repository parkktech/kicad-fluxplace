skew_ps_target = 1.08      # 0.15 mm CM5 2.2.1 PDF p.8
length_mm_target = 25.4    # Pulse p.2 ideal "approximately one inch behind the magnetic"; also a >= 25 mm MINIMUM (EMI)
# no loss/stub/via keys: no sourced numbers (Pulse: <= 2 vias per trace, avoid stubs)
source = "Pulse Ethernet magnetics layout note (farnell.com/datasheets/2699973.pdf) p.1-3; TI SNLA387 p.2; CM5 ds 2.2.1"

[channel.ETH_L]            # 1000BASE-T line side, HX5084 -> RJ45 J12. MATCH ETH_L[0-3]_ ONLY: prefix also hits ETH_LED_*
