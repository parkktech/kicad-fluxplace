# D71cv/D71cw channel budgets from docs/V2.0/CHANNEL-BUDGETS-RESEARCH.md (2026-11-22)
[channel.PCIE_]            # PCIe Gen2 x1 + REFCLK, CM5 -> M.2 Key B (diff pairs only; not CLKREQ/RST/WAKE)
freq_ghz = 4.0             # Gen3 Nyquist: CM5 Gen3 "unsupported" but possible; Gen2 has no public split
loss_db_max = 12.0         # Astera Gen3 system board 10.3 + CEM connector 1.7 (REC; mapping to carrier INF)
loss_db_target = 7.6       # INF: max - 20 % of 22 dB channel (Astera FAQ margin 10-20 %)
skew_ps_max = 0.91         # 0.127 mm (TI 5 mil, SNLA426 p.7 / SPRAAR7J Table A-2 p.16) x 7.2 ps/mm; D71cv
skew_ps_target = 0.72      # 0.1 mm (CM5 datasheet 2.3.1 PDF p.9, "ideally") x 7.2
length_mm_max = 200.0      # Quectel RM520N-GL HW Design V1.0 4.3 PDF p.46 "Keep ... less than 200 mm" (REQ)
length_mm_target = 119.0   # INF proxy: TI SPRAAR7J Table A-2 p.16 AM57xx max 4700 mil
stub_mm_max = 1.3          # TI SNLA426 via section: 51 mil unbackdrilled stub (target 0.38 mm, SPRAAR7J p.11)
via_db = 0.3               # INF placeholder: Pericom AN321 0.3-0.8 dB/via (search summary, unverified)
connector_db = 1.7         # INF proxy: Astera CEM connector; M.2 socket loss not published
source = "CM5 ds R3 2.3; Quectel RM520N-GL V1.0 4.3 p.46; TI SNLA426 p.3,p.7; TI SPRAAR7J p.11,p.16; asteralabs.com PCIe 5.0 IL budget"

[channel.USB3_]            # USB 3.0 Gen1, CM5 -> M.2 Key B
freq_ghz = 2.5
loss_db_max = 10.0         # USB-IF Gen1 host-side allocation (Glenair AN0001 4.2 p.5, quoting USB-IF)
loss_db_target = 6.0       # INF: max - 20 % of 20 dB end-to-end
skew_ps_max = 0.91         # 0.127 mm TI 5 mil x 7.2; D71cv
skew_ps_target = 0.72      # 0.1 mm CM5 2.4.1 x 7.2
length_mm_max = 254.0      # host PCB "typically 10 inches maximum" (Glenair AN0001 p.5)
length_mm_target = 88.9    # INF proxy: TI SPRAAR7J Table A-2 AM57xx USB3 max 3500 mil
stub_mm_max = 1.3          # as PCIe (TI SNLA426); AM57xx table allows 0 stubs
via_db = 0.3               # INF placeholder (Pericom AN321, unverified)
connector_db = 1.7         # INF proxy (Astera CEM); Intel internal USB3 connector is 3.0 dB @2.5 GHz
source = "Glenair AN0001 p.5; TI SLLA432 p.5; CM5 ds 2.4.1; TI SPRAAR7J Table A-2; Quectel 4.2 p.43 (TX/RX inter-pair <10 mm, not in schema)"

[channel.USB_]             # USB 2.0 HS: CM5->hub (USB_*_CM5), hub->J5 (USB_HUB_*, USB_*_J); diff pairs only (not USB_CC*)
skew_ps_max = 9.1          # 1.27 mm (TI SPRAAR7J 50 mil; Microchip AN26.2 p.17 1.25 mm) x 7.2; D71cv
skew_ps_target = 1.08      # 0.15 mm CM5 2.4.2 x 7.2
length_mm_max = 203.0      # TI TUSB4041I 7.4.1.3 p.25 "8 in maximum recommended" (REC), per hub segment
length_mm_target = 150.0   # Microchip AN26.2 3.6.5.2 p.17 (hub vendor), per segment
stub_mm_max = 3.5          # USB Type-C R2.0 Table 3-4 p.69 A6/B6, A7/B7 shorting trace
# no loss_db_*, via_db, connector_db: no USB 2.0 PCB dB budget exists in any source found
source = "Microchip AN26.2 DS00001876D p.8,p.16-17; TI TUSB4041I p.24-25; TI SPRAAR7J; CM5 ds 2.4.2; USB Type-C R2.0 Table 3-4"

[channel.USB2_]            # USB 2.0 HS hub -> M.2 Key B
skew_ps_max = 9.1
skew_ps_target = 1.08
length_mm_max = 203.0      # TUSB4041I; Quectel allows 225 mm (4.2 p.43)
length_mm_target = 150.0   # AN26.2
stub_mm_max = 3.5          # INF: Type-C spur allowance applied to any HS stub; AN26.2 says avoid stubs
source = "as [channel.USB_]; Quectel RM520N-GL 4.2 p.43 (<225 mm, <2 mm intra-pair)"

[channel.ETH_P]            # 1000BASE-T PHY side, CM5 -> TPD4E02B04 -> HX5084 (ETH_P[0-3]_*)
