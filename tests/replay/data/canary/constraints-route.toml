# GENERATED by run-w16-a.sh from constraints.toml: edit constraints.toml, never this file
# UTV Comms Bridge — engineering constraints for the fluxplace review gate.
# Every block here is a rule an outside reviewer applied to V1.4 by hand
# (Review Document.pdf, 2026-09-03). The gate now applies them on every
# fab/deliver run. See docs/DECISIONS.md D70.

not_pairs = ["SENSE_ADC_P", "SENSE_ADC_N",   # D71ci: DC divider tap, plain signals
  "HPL_PRI_N", "HPL_PRI_P", "INJ_PRI_N", "INJ_PRI_P", "INJ_SEC_N", "INJ_SEC_P", "MIC_ADC_N", "MIC_ADC_P", "MIC_N", "MIC_P", "MIC_SEC_N", "MIC_SEC_P", "MIX_OUT_N", "MIX_OUT_P", "RX_ADC_N", "RX_ADC_P", "RX_SEC_N", "RX_SEC_P", "SENSE_N_DIV", "SENSE_P_DIV", "SPK_COMM_N", "SPK_COMM_P", "SPK_COMM_N_J", "SPK_COMM_P_J", "SPK_RADIO_N", "SPK_RADIO_P"]   # D71en: kHz analog audio/sense, transformer-coupled; plain signals

[env]   # 2026-09-04 (user): mostly inside vehicle cabs, UTVs used 30..100 F ambient;
        # Arizona heat is the dominant risk. Floor relaxed -40 -> -20 C (30 F with
        # margin); ceiling stays +85 C for a sun-soaked cab and enclosure rise.
temp_min_c = -20
temp_max_c = 85
vibration = "high"
moisture = "outdoor"
transient = "auto-12v"
location = "exposed-vehicle"

# The board is assembled in China (user directive 2026-09-03): every MPN is
# graded on JLCPCB/LCSC live stock as well as DigiKey/Mouser. CN_ABSENT and
# CN_NONE fail the gate; consigned parts are waived by name with the reason.
[sourcing]
china = true
cn_need = 100
[sourcing.cn_alias]         # our MPN -> what LCSC catalogues it under
"G6K-2F-Y DC5" = "G6K-2F-Y-5V"
"HX5084FNLT" = "HX5084FNL"
"BAT60AE6327HTSA1" = "BAT60AE6327"
"0436500215" = "43650-0215"      # LCSC lists the Molex header under the hyphenated form (C293740)

# Documentation is a build requirement (D70q): every MPN's datasheet lives in
# docs/datasheets with datasheets.json; every pinmap cites its page.
[docs]
datasheets = "docs/datasheets"
strict = true
project_libs = ["hardware/lib/footprints/utv-comms.pretty"]   # footprints drawn here need a landpattern citation (D70x)

# Rule 1: Pin 1 (PTT) is straight copper J1 -> J2. No component ever touches it.
[nets.PTT_THRU]
# V1.6 (D71, D71at): two SHUNT attachments are allowed on pin 1 — R503 (2 Mohm PTT sense divider top)
# and R519 (100 ohm, PTT key switch output). Both are parallel to the copper; nothing is in series.
straight_copper = ["J1A:1", "J2A:1", "R503:1", "R519:2"]

# RF: GNSS feed, antenna switch and both antenna paths at 50 ohm, graded on
# the layer the copper is on. One layer transition allowed per net.
[rf]
target_z = 50
tolerance_pct = 10
max_vias = 1
neck_max_mm = 2.5           # a +-0.6 mm neck that straddles a segment joint reads as ~2.4 mm

# Gigabit Ethernet: P and N within 0.15 mm (CM5 datasheet, D71cm)
[pairs.ETH_]
impedance_diff = 100
width_mm = 0.15            # = board class ETH_100R (0.15/0.25 -> 102.8 ohm); keeps routing margin above the 0.127 floor
gap_mm = 0.25
skew_mm = 0.15
skew_max_mm = 0.5          # D71cv maximum (fails above); skew_mm is the target

[si]
default_skew_mm = 1.0

# Raw 12V input bus (VBATT_IN, ahead of D1/Q1): lead-acid or Li-ion vehicle
# battery, <= 14.5 V max per the user (2026-09-07, D70ao) — Li-ion charge
# voltage plus alternator ripple headroom, not a nominal 12 V figure.
[power."VBATT_IN"]
max_v = 14.5
# Electrical review 2026-11-15 (docs/derived/v16-electrical-findings.md). Every entry below cites its evidence; confidence in brackets.
nominal_v = 12.0
min_v = 9.0                  # spec 3.1 acceptance point; NO cranking / low-battery cut-off voltage is stated anywhere (see [fuse] also_v)
surge_v = 29.2               # D1 SMDJ18A Vc at Ipp (SMDJ18A.pdf#p2)
max_current_ma = 5000        # limited by the 5 A battery-lead fuse (spec 3.1) and J3's 5 A circuit rating (Molex 43650, secondary source) [medium]
pour = true

[power."VBATT_PROT"]        # after Q1 SI7155DP (-40 V Vds, 3.6 mOhm, SI7155DP-T1-GE3.pdf#p1); same current and voltages as VBATT_IN
support = { C49 = "U100.12", R2 = "Q1.1" }   # D71eg: C49 extra 100 V HF bypass at LM61460 VIN2 (LM61460AASQRJRRQ1.pdf#p15); R2 is the Q1 gate-source bleed, sits at Q1 source pads (SI7155DP-T1-GE3.pdf#p1)
max_v = 14.5
nominal_v = 12.0
min_v = 9.0
surge_v = 29.2
max_current_ma = 5000
pour = true

