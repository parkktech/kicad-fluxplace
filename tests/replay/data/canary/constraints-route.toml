# Merge after the W16 constraints.toml.

# ---- hard minimum (a datasheet figure exists)
[[separation]]
name = "gnss-other-rf"
a = ["U3"]                                             # GNSS module
b = ["U305", "U306", "U307", "U308", "ANT300", "J203", "J204", "J300"]      # BT modules, BT chip antenna, 5G / SAT / BT jacks (J4 is its own feed)
min_mm = 5.0
klass = "REC"
source = "u-blox MAX-M10S Integration Manual UBX-20053088: >= 5 mm to any other RF component (report; MAX-M10M page to cite)"

# Switched off: the figure is for a BT850 with the on-module antenna (BT850-SA). The BOM part is BT850-ST, whose antenna is
# external on the RF pad, so the 20 mm applies to the antenna part, not to the module. Coordinator: confirm the variant from
# the datasheet in docs/datasheets, then move the row to the antenna (ANT300 and its Johanson keep-out figure) or delete it.
[[separation]]
name = "bt850-metal"
a = ["U305", "U306", "U307", "U308"]
b = ["J12", "J3", "J4", "J203", "J204", "J300", "K1", "T3"]
min_mm = 20.0
target_mm = 30.0
klass = "REC"
source = "BT850 datasheet: metal closer than 20 mm degrades the antenna, 30-40 mm is safe (report)"
enabled = false

# ---- scored (no vendor millimetre figure: the distance is reported, nothing fails; the floorplan term of step 6 reads them)
[[separation]]
name = "clock-harmonic-gnss"
a = ["Y300", "Y400", "Y500"]                           # Y300 added by EVAL-PLACER-STEP3: the hub crystal was missing
b = ["U3", "J4"]
why = "harmonics in the GNSS L1 band: 40 MHz x 40 = 1600 MHz (GLONASS L1), 12.288 MHz x 128 = 1572.9 MHz (Galileo E1 / GPS L1 skirt), 24 MHz x 65 = 1560.0 MHz (BeiDou B1I, 1561.098 +- 2.046 MHz); derived arithmetic, not in the report. u-blox UBX-15030289: clock harmonics up to 1.5 GHz and above exceed thermal noise; the receiver tolerates 6-12 dB of in-band jammer"

[[separation]]
name = "cm5-gnss"                                      # EVAL-PLACER-STEP3: the largest digital source on the board had no row
a = ["J10", "J11"]                                     # CM5 connectors (the module sits over them)
b = ["U3", "J4"]
why = "CM5 processor, memory and on-board WiFi / BT radio against the GNSS receiver and its feed; no vendor distance figure"

[[separation]]
name = "isolated-dcdc-gnss"                            # EVAL-PLACER-STEP3
a = ["U404", "U405"]                                   # ISOW1044: integrated isolated DC-DC, switches in the tens of MHz
b = ["U3", "J4"]
why = "isolated DC-DC transformer driver radiates across the isolation gap (TI ISOW1044 datasheet, layout section; page to cite); no vendor distance figure"

[[separation]]
name = "pcie-usb3-gnss"
a = ["J200"]                                           # M.2 slot: PCIe REFCLK and USB 3.0 end here
b = ["U3", "J4"]
why = "100 MHz PCIe REFCLK x 16 = 1600 MHz (report); USB 3.0 broadband noise to about 5 GHz (Intel 327216)"

[[separation]]
name = "usb3-bt-2g4"
a = ["J200"]
b = ["ANT300", "J300", "U305", "U306", "U307", "U308"]
why = "USB 3.0 raises the 2.4 GHz noise floor 20-25 dB from connectors and cables (Intel 327216)"

[[separation]]
name = "buck-gnss-audio"
a = ["U100", "L100", "U101", "L101", "U102", "L102"]
b = ["U3", "U5", "T1", "T2", "T500", "T501"]
why = "switch node and inductor field against GNSS, codec and audio transformers (TI SNAA033D; the transformer distance is an inference, no vendor figure)"

[[separation]]
name = "modem-audio"
a = ["J200"]
