[package]
name = "fpkernel"
version = "0.1.0"
edition = "2021"
description = "fluxplace in-memory board kernel (C ABI, JSON requests)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
panic = "unwind"
